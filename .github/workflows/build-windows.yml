name: Build Windows Exe

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build exe
        run: |
          pyinstaller --onefile --name hello_xpr hello_app/hello.py

      - name: Smoke test the exe
        run: |
          python hello_app/test_hello.py dist/hello_xpr.exe

      - name: Upload exe as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello_xpr-windows-exe
          path: dist/hello_xpr.exe
